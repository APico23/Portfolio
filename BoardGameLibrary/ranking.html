<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board Game Ranking</title>
    <meta name="description" content="Austin's owned board games ordered from favorite to least favorite." />
    <meta name="theme-color" content="#174f59" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=__ASSET_VERSION__" />
  </head>
  <body data-page="ranking">
    <div class="page-shell">
      <header class="topbar compact-topbar">
        <div class="brand-block">
          <span class="cabinet-label">Austin's collection</span>
          <h1>Board Game Ranking</h1>
          <p>Every owned game ordered from favorite to least favorite.</p>
        </div>
        <a class="home-link" href="../index.html">Back to home</a>
      </header>

      <nav class="page-nav" aria-label="Board game library">
        <a class="nav-link" data-nav="collection" href="index.html">Collection</a>
        <a class="nav-link" data-nav="ranking" href="ranking.html">Ranking</a>
        <a class="nav-link" data-nav="plays" href="plays.html">Plays</a>
        <a class="nav-link" data-nav="players" href="players.html">Players</a>
        <a class="nav-link" data-nav="manage" href="manage.html">Manage</a>
      </nav>

      <div id="globalStatus" class="status-banner" role="status" hidden></div>

      <main class="ranking-layout">
        <section class="ranking-heading">
          <div>
            <h2>Favorite first</h2>
            <p id="rankingCount">Loading ranked games...</p>
          </div>
          <p class="admin-context" id="rankingAdminContext">Public view</p>
        </section>

        <ol class="ranking-list" id="rankingList" aria-live="polite">
          <li class="loading-block">Loading ranked games...</li>
        </ol>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.0/dist/umd/supabase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <script src="app.js?v=__ASSET_VERSION__"></script>
  </body>
</html>
