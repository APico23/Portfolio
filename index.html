<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Austin Pico Website</title>
    <style>
      :root {
        --off-white: #f7f4ea;
        --ink: #1f2a36;
        --muted: #5f6b7a;
        --gold: #e6bc49;
        --blue: #2f6ca3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", "Trebuchet MS", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 20% 20%, #f4e3a7 0%, transparent 35%),
          radial-gradient(circle at 80% 10%, #d7e9fa 0%, transparent 30%),
          var(--off-white);
      }

      main {
        width: min(920px, 94vw);
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid #e9debf;
        border-radius: 24px;
        padding: 2.4rem;
        box-shadow: 0 14px 36px rgba(27, 44, 66, 0.1);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4.2vw, 3.3rem);
      }

      p {
        margin: 0.9rem 0 0;
        max-width: 62ch;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .bubble-row {
        margin-top: 1.8rem;
      }

      .bubble {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 190px;
        min-height: 92px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 800;
        letter-spacing: 0.02em;
        color: #2f2407;
        background: linear-gradient(145deg, #f1cd66, var(--gold));
        border: 2px solid #d3a739;
        box-shadow:
          0 8px 20px rgba(210, 166, 56, 0.34),
          inset 0 1px 0 rgba(255, 255, 255, 0.7);
        transition: transform 140ms ease, box-shadow 140ms ease;
      }

      .bubble:hover {
        transform: translateY(-2px) scale(1.01);
        box-shadow:
          0 12px 24px rgba(210, 166, 56, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      .bubble-wedding {
        background: linear-gradient(145deg, #7bbce0, #4a8fce);
        border-color: #3a7cb0;
        color: #fff;
        box-shadow:
          0 8px 20px rgba(74, 143, 206, 0.34),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }

      .bubble-wedding:hover {
        box-shadow:
          0 12px 24px rgba(74, 143, 206, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }

    </style>
  </head>
  <body>
    <main>
      <h1>Welcome to Austin Pico's website</h1>
      <p>
        This is the home page for Austin's various tools and projects. Use the bubbles below to explore.
      </p>
      <div class="bubble-row">
        <a class="bubble" href="MenuCreator/planner.html#data">Menu Creator</a>
        <a class="bubble bubble-wedding" href="Weddordle/weddordle.html">Weddordle</a>
        <a class="bubble" href="ChickenSandwichDB/master.html">Chicken Sandwich DB</a>
      </div>
    </main>
  </body>
</html>
